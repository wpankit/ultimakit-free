name: Build plugin zip

# Produces an installable plugin zip containing only the files WordPress needs.
# What gets left out is defined in .distignore at the repo root.
#
# Publishing a GitHub release (tag v1.2.3 or 1.2.3) also deploys the zip's contents to
# WordPress.org: trunk and tags/1.2.3 in SVN, plus the listing assets from .wordpress-org.
# Running the workflow by hand (Actions > Build plugin zip > Run workflow) makes the same
# deploy as a dry run, which prepares the SVN commit without committing anything.
#
# The deploy needs the repository secrets SVN_USERNAME and SVN_PASSWORD (the SVN password
# from your wordpress.org profile, under Account & Security).
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-zip-${{ github.ref }}
  # A newer push or pull request update replaces an older build; a release never does.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    # Needed only by the final step, which uploads the zip to a published release.
    permissions:
      contents: write
    outputs:
      slug: ${{ steps.plugin.outputs.slug }}
      version: ${{ steps.plugin.outputs.version }}
      zip: ${{ steps.zip.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read slug and version from the plugin header
        id: plugin
        run: |
          set -euo pipefail
          FILE="wp-ultimakit.php"

          # The zip's top-level folder must be the plugin slug, because that becomes the
          # directory name under wp-content/plugins on install. Text Domain is the
          # canonical slug (ultimakit-for-wp) — the repo folder name is not.
          SLUG=$(grep -m1 'Text Domain:' "$FILE" | sed -E 's/.*Text Domain:[[:space:]]*//' | tr -d '\r' | xargs)
          VERSION=$(grep -m1 '^ \* Version:' "$FILE" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r' | xargs)

          if [ -z "$SLUG" ] || [ -z "$VERSION" ]; then
            echo "::error::Could not parse Text Domain / Version from $FILE"
            exit 1
          fi

          echo "slug=$SLUG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $SLUG version $VERSION"

      # Before a release or a deploy dry run: the plugin header, ULTIMAKIT_FOR_WP_VERSION and
      # the readme's Stable tag must agree, and a release tag must match them.
      - name: Check the version numbers match
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.plugin.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          CONSTANT=$(sed -n "s/^[[:space:]]*define( 'ULTIMAKIT_FOR_WP_VERSION', '\([^']*\)' );/\1/p" wp-ultimakit.php | head -n 1)
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' README.txt | head -n 1 | tr -d '[:space:]')
          echo "Plugin header: $VERSION, ULTIMAKIT_FOR_WP_VERSION: $CONSTANT, readme Stable tag: $STABLE"
          if [ "$VERSION" != "$CONSTANT" ] || [ "$VERSION" != "$STABLE" ]; then
            echo "::error::The plugin header Version, ULTIMAKIT_FOR_WP_VERSION and the readme Stable tag must all be the same."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "${RELEASE_TAG#v}" != "$VERSION" ]; then
            echo "::error::The release tag ($RELEASE_TAG) does not match the plugin version ($VERSION)."
            exit 1
          fi

      - name: Stage plugin files
        env:
          SLUG: ${{ steps.plugin.outputs.slug }}
        run: |
          set -euo pipefail
          mkdir -p "build/$SLUG"

          # The Freemius SDK is runtime-critical — the plugin fatals without it, and it sits
          # under a dev-sounding src/ path. rsync applies rules in order and stops at the
          # first match, so protecting it here means no later pattern (now or after a future
          # SDK update introduces new file types) can strip anything out of it.
          rsync -a \
            --include='/src/freemius/***' \
            --exclude-from=.distignore \
            --exclude='/build' \
            ./ "build/$SLUG/"

          # Belt and braces: .distignore names the hidden entries that exist today, but
          # this guarantees nothing hidden ships even if a new dotfile is added later.
          find "build/$SLUG" -name '.*' -prune -exec rm -rf {} +

          # Empty directories carry no meaning in a plugin zip.
          find "build/$SLUG" -type d -empty -delete

      - name: Verify the staged plugin
        env:
          SLUG: ${{ steps.plugin.outputs.slug }}
        run: |
          set -euo pipefail
          ROOT="build/$SLUG"
          fail=0

          require() {
            if [ ! -e "$ROOT/$1" ]; then
              echo "::error::Missing required file: $1"
              fail=1
            fi
          }

          refuse() {
            if [ -e "$ROOT/$1" ]; then
              echo "::error::Development file leaked into the build: $1"
              fail=1
            fi
          }

          # Runtime-critical
          require "wp-ultimakit.php"
          require "README.txt"
          require "includes/class-wp-ultimakit.php"
          require "admin/css/main.css"
          require "src/freemius/start.php"   # Freemius SDK — the plugin fatals without it
          require "modules"
          require "languages"

          # Must never ship
          refuse ".git"
          refuse ".github"
          refuse ".claude"
          refuse ".wordpress-org"
          refuse "vendor"
          refuse "composer.json"
          refuse "phpcs.xml.dist"
          refuse "tools"
          refuse "CONTRIBUTING.md"
          refuse "admin/css/package-lock.json"
          refuse "admin/css/bootstrap.min.css"

          if find "$ROOT" -name '.*' -print -quit | grep -q .; then
            echo "::error::Hidden files remain in the build:"
            find "$ROOT" -name '.*'
            fail=1
          fi

          # The Freemius SDK must arrive byte-for-byte complete. Comparing against the
          # checkout catches any future pattern that silently clips a file out of it.
          SRC_SDK=$(find src/freemius -type f | wc -l)
          OUT_SDK=$(find "$ROOT/src/freemius" -type f | wc -l)
          if [ "$SRC_SDK" -ne "$OUT_SDK" ]; then
            echo "::error::Freemius SDK is incomplete: $OUT_SDK of $SRC_SDK files were staged."
            diff <(cd src/freemius && find . -type f | sort) \
                 <(cd "$ROOT/src/freemius" && find . -type f | sort) || true
            fail=1
          else
            echo "Freemius SDK: $OUT_SDK/$SRC_SDK files staged."
          fi

          echo "Staged $(find "$ROOT" -type f | wc -l) files, $(du -sh "$ROOT" | cut -f1) total."
          exit $fail

      - name: Create zip
        id: zip
        env:
          SLUG: ${{ steps.plugin.outputs.slug }}
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          set -euo pipefail
          NAME="$SLUG-$VERSION.zip"
          ( cd build && zip -rq "../$NAME" "$SLUG" )

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$NAME" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files: $(unzip -l "$NAME" | tail -1 | awk '{print $2}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plugin.outputs.slug }}-${{ steps.plugin.outputs.version }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      # Only when a GitHub Release is published — a push to main never publishes anything.
      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber

  deploy:
    name: Deploy to WordPress.org
    needs: build
    # A published release deploys; running the workflow by hand is a dry run.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never two SVN commits at once, also with the readme and assets workflow.
    concurrency:
      group: deploy-wordpress-org
      cancel-in-progress: false

    steps:
      # For the listing assets in .wordpress-org.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the plugin zip
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.slug }}-${{ needs.build.outputs.version }}

      - name: Unpack the plugin zip
        env:
          ZIP: ${{ needs.build.outputs.zip }}
        run: unzip -q "$ZIP" -d build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name != 'release' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ needs.build.outputs.slug }}
          VERSION: ${{ needs.build.outputs.version }}
          # SVN gets exactly the files in the zip, which .distignore already filtered.
          BUILD_DIR: build/${{ needs.build.outputs.slug }}
